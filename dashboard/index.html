<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- REF-DASH-01 — API URL loaded dynamically from server -->
    <script src="http://100.120.249.6:4000/client-config.js"></script>
</head>
<body>

    <!-- REF-DASH-02 — Login Screen -->
    <div id="login-screen" class="login-screen hidden">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-avatar" id="login-avatar">P</div>
                <div class="login-title">Penny</div>
                <div class="login-sub">Security Platform</div>
            </div>
            <div class="login-form">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="login-username" class="form-input" placeholder="Username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="Password" autocomplete="current-password">
                </div>
                <div id="login-error" class="form-error hidden"></div>
                <button class="btn-primary btn-full" id="login-btn" onclick="handleLogin()">Sign In</button>
            </div>
        </div>
    </div>

    <!-- REF-DASH-03 — First Run Setup -->
    <div id="setup-screen" class="login-screen hidden">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-avatar">P</div>
                <div class="login-title">Welcome to Penny</div>
                <div class="login-sub">Create your Platform Owner account</div>
            </div>
            <div class="login-form">
                <div class="setup-notice">No owner account found. This setup can only be completed once.</div>
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="setup-username" class="form-input" placeholder="Username">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="setup-password" class="form-input" placeholder="Min 8 characters">
                </div>
                <div class="form-group">
                    <label class="form-label">Discord ID <span class="form-optional">(optional)</span></label>
                    <input type="text" id="setup-discord" class="form-input" placeholder="Your Discord user ID">
                </div>
                <div id="setup-error" class="form-error hidden"></div>
                <button class="btn-primary btn-full" onclick="handleSetup()">Create Owner Account</button>
            </div>
        </div>
    </div>

    <!-- REF-DASH-04 — Main Dashboard -->
    <div id="dashboard" class="dashboard hidden">

        <!-- REF-DASH-05 — Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-avatar" id="nav-avatar">P</div>
                <div>
                    <div class="brand-name">Penny</div>
                    <div class="brand-sub">Security Platform</div>
                </div>
            </div>

            <div class="sb-server">
                <div class="sb-server-icon" id="sb-server-icon">?</div>
                <select class="sb-server-select" id="guild-select" onchange="selectGuild(this.value)">
                    <option value="">Select server</option>
                </select>
            </div>

            <nav class="nav">

                <!-- Dashboard — top level, no group -->
                <button class="nav-item nav-top" data-section="overview">DASHBOARD</button>

                <!-- Security -->
                <div class="nav-group" id="group-security">
                    <button class="nav-group-header" onclick="toggleGroup('security')">
                        <span>SECURITY</span>
                        <span class="nav-chevron" id="chevron-security">▸</span>
                    </button>
                    <div class="nav-group-children" id="children-security">
                        <button class="nav-item" data-section="secoverview">Overview</button>
                        <button class="nav-item" data-section="secspam">Spam Detection</button>
                        <button class="nav-item" data-section="secraid">Anti-Raid</button>
                        <button class="nav-item" data-section="secbadwords">Bad Word Filter</button>
                        <button class="nav-item" data-section="seccaps">Caps Filter</button>
                        <button class="nav-item" data-section="secmention">Mass Mention</button>
                        <button class="nav-item" data-section="secinvite">Anti-Invite Links</button>
                        <button class="nav-item" data-section="secage">Account Age Gate</button>
                        <button class="nav-item" data-section="secphishing">Anti-Phishing</button>
                        <button class="nav-item" data-section="secantilink">Anti-Link</button>
                        <button class="nav-item" data-section="secrepeat">Repeated Text</button>
                        <button class="nav-item" data-section="secemoji">Emoji Spam</button>
                        <button class="nav-item" data-section="secnewline">Newline Spam</button>
                        <button class="nav-item" data-section="seczalgo">Zalgo Text</button>
                        <button class="nav-item" data-section="sechoist">Anti-Hoist</button>
                        <button class="nav-item" data-section="antinuke">Anti-Nuke</button>                        
                        <button class="nav-item" data-section="verification">Verification</button>
                        <button class="nav-item" data-section="joingate">Join Gate</button>
                    </div>
                </div>

                <!-- Moderation -->
                <div class="nav-group" id="group-moderation">
                    <button class="nav-group-header" onclick="toggleGroup('moderation')">
                        <span>MODERATION</span>
                        <span class="nav-chevron" id="chevron-moderation">▸</span>
                    </button>
                    <div class="nav-group-children" id="children-moderation">
                        <button class="nav-item" data-section="modlog">Mod Log</button>
                        <button class="nav-item" data-section="warnings">Warnings</button>
                        <button class="nav-item" data-section="punishments">Punishment Ladder</button>
                        <button class="nav-item" data-section="exemptions">Exemptions</button>
                    </div>
                </div>

                <!-- Audit Log -->
                <div class="nav-group" id="group-audit">
                    <button class="nav-group-header" onclick="toggleGroup('audit')">
                        <span>AUDIT LOG</span>
                        <span class="nav-chevron" id="chevron-audit">▸</span>
                    </button>
                    <div class="nav-group-children" id="children-audit">
                        <button class="nav-item" data-section="auditlog">Events</button>
                        <button class="nav-item" data-section="auditconfig">Settings</button>
                    </div>
                </div>

                <!-- Community -->
                <div class="nav-group" id="group-community">
                    <button class="nav-group-header" onclick="toggleGroup('community')">
                        <span>COMMUNITY</span>
                        <span class="nav-chevron" id="chevron-community">▸</span>
                    </button>
                    <div class="nav-group-children" id="children-community">
                        <button class="nav-item" data-section="leveling">Leveling</button>
                        <button class="nav-item" data-section="reactionroles">Reaction Roles</button>
                        <button class="nav-item" data-section="giveaways">Giveaways</button>
                        <button class="nav-item" data-section="polls">Polls</button>
                        <button class="nav-item" data-section="tickets">Ticketing</button>
                    </div>
                </div>

                <!-- Automation -->
                <div class="nav-group" id="group-automation">
                    <button class="nav-group-header" onclick="toggleGroup('automation')">
                        <span>AUTOMATION</span>
                        <span class="nav-chevron" id="chevron-automation">▸</span>
                    </button>
                    <div class="nav-group-children" id="children-automation">
                        <button class="nav-item" data-section="commands">Custom Commands</button>
                        <button class="nav-item" data-section="autoresponder">Auto-Responder</button>
                        <button class="nav-item" data-section="scheduled">Scheduled Messages</button>
                        <button class="nav-item" data-section="reminders">Reminders</button>
                        <button class="nav-item" data-section="afk">AFK Status</button>
                        <button class="nav-item" data-section="socials">Social Alerts</button>
                    </div>
                </div>

                <!-- Configuration -->
                <div class="nav-group" id="group-configuration">
                    <button class="nav-group-header" onclick="toggleGroup('configuration')">
                        <span>CONFIGURATION</span>
                        <span class="nav-chevron" id="chevron-configuration">▸</span>
                    </button>
                    <div class="nav-group-children" id="children-configuration">
                        <button class="nav-item" data-section="welcome">Welcome & Roles</button>
                        <button class="nav-item owner-only" data-section="users">Users</button>
                        <button class="nav-item" data-section="settings">Settings</button>
                    </div>
                </div>

            </nav>

            <div class="sidebar-footer">
                <div class="sb-user">
                    <div class="sb-user-avatar" id="sb-user-avatar">?</div>
                    <div class="sb-user-info">
                        <div class="sb-user-name" id="sb-user-name"></div>
                        <div class="sb-user-role" id="sb-user-role"></div>
                    </div>
                    <button class="logout-btn" onclick="handleLogout()">Sign out</button>
                </div>
            </div>
        </aside>
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>

        <!-- REF-DASH-06 — Main -->
        <div class="main">

        <!-- REF-DASH-07 — Top Bar -->
                    <div class="topbar">
                        <button class="hamburger" onclick="toggleMobileSidebar()">☰</button>
                        <div class="topbar-title" id="page-title">Dashboard</div>
                            <div class="topbar-right">
                    <div class="status-pill">
                        <div class="status-dot" id="status-dot"></div>
                        <span class="status-text" id="status-text">Checking...</span>
                    </div>
                    <div class="test-badge hidden" id="test-badge">TEST MODE</div>
                    <button class="panic-btn" onclick="handlePanicMode()">Panic Mode</button>
                    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">☾</button>
                </div>
            </div>

            <!-- REF-DASH-08 — Sub Nav -->
            <div class="subnav" id="subnav"></div>

            <!-- REF-DASH-09 — Content -->
            <main class="content" id="content"></main>

        </div>
    </div>
    
    <!-- REF-DASH-10 — Global Modal -->
    <div class="modal-overlay hidden" id="modal-overlay" onclick="handleModalOverlayClick(event)">
        <div class="modal" id="modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-title"></div>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div> 

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
